<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDF2E0">
<title>你是哪种 AI 程序员？| DataClawHub</title>
<meta name="description" content="四道题，看看你跟 AI 一起干活时是哪一路。结果生成在你的手机上，不收集个人信息。">
<style>
/* ============ 设计变量 ============ */
:root{
  --bg-a:#FEF6E9;
  --bg-b:#FBE9D2;
  --bg-c:#F7DCBE;
  --card:#FFFCF7;
  --card-2:#FFF8EE;
  --ink:#43301F;
  --ink-2:#6C533C;
  --muted:#9D8165;
  --line:rgba(190,132,78,.20);
  --line-2:rgba(190,132,78,.34);
  --accent:#C8763A;
  --accent-d:#AC5C24;
  --accent-soft:rgba(200,118,58,.10);
  --radius:26px;
  --radius-sm:16px;
  --shadow:0 10px 30px -12px rgba(150,95,45,.30), 0 2px 6px -2px rgba(150,95,45,.14);
  --shadow-sm:0 4px 14px -8px rgba(150,95,45,.30);
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--bg-b);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ============ 背景：暖米色渐变 + 三团柔光 ============ */
.bg{
  position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(120% 80% at 50% -10%, #FFFBF2 0%, rgba(255,251,242,0) 55%),
    linear-gradient(168deg, var(--bg-a) 0%, var(--bg-b) 42%, var(--bg-c) 100%);
}
.bg::before,.bg::after{
  content:""; position:absolute; border-radius:50%; filter:blur(46px); opacity:.55;
}
.bg::before{ width:340px;height:340px; left:-120px; top:6%;
  background:radial-gradient(circle,#FFD9AE 0%,rgba(255,217,174,0) 70%); }
.bg::after{ width:400px;height:400px; right:-150px; top:26%;
  background:radial-gradient(circle,#FFC9A0 0%,rgba(255,201,160,0) 70%); }
.bg-blob{ position:absolute; width:300px;height:300px; left:38%; bottom:-90px;
  border-radius:50%; filter:blur(50px); opacity:.4;
  background:radial-gradient(circle,#FFE6C4 0%,rgba(255,230,196,0) 70%); }

/* ============ 版心 ============ */
.wrap{
  max-width:560px;
  margin:0 auto;
  padding:26px 20px calc(48px + env(safe-area-inset-bottom,0px));
}

/* ============ 品牌行 ============ */
.brand{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.2px}
.brand b{font-weight:800;font-size:14px;color:#8E5427;letter-spacing:.4px}
.brand i{font-style:italic;color:var(--muted);font-size:12.5px}
.brand .bar{width:1px;height:12px;background:var(--line-2)}

/* ============ 封面 ============ */
#intro{padding-top:14px}
.hero-h1{
  margin:14px 0 10px;
  font-size:36px; line-height:1.22; font-weight:900;
  letter-spacing:-.6px;
  color:#B45E27;
  text-shadow:0 1px 0 rgba(255,255,255,.65);
}
.hero-h1 em{font-style:normal; color:#8E4520}
.hero-sub{margin:0 0 26px; color:var(--ink-2); font-size:15px; line-height:1.75}

.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; border:0; cursor:pointer;
  font-family:inherit; font-size:17px; font-weight:700; color:#fff;
  padding:17px 22px; border-radius:999px;
  background:linear-gradient(180deg,#D68A4C 0%,var(--accent) 46%,var(--accent-d) 100%);
  box-shadow:0 12px 24px -12px rgba(172,92,36,.85), inset 0 1px 0 rgba(255,255,255,.34);
  transition:transform .16s ease, box-shadow .16s ease;
}
.btn:active{transform:translateY(1px) scale(.995); box-shadow:0 6px 16px -10px rgba(172,92,36,.85)}
.btn-note{margin:12px 0 0; text-align:center; font-size:12.5px; color:var(--muted)}

/* ============ 封面：角色条 ============ */
.strip{display:flex; gap:9px; margin:30px 0 9px}
.strip img{
  flex:1; width:0; min-width:0;
  aspect-ratio:720/790; object-fit:cover; object-position:50% 0%;
  border-radius:15px;
  border:1px solid rgba(190,132,78,.28);
  box-shadow:0 8px 18px -12px rgba(120,72,30,.55);
  filter:saturate(1.08) sepia(.16) brightness(1.10);
}
.strip-cap{margin:0; text-align:center; font-size:12px; color:var(--muted); letter-spacing:.5px}

/* ============ 卡片通用 ============ */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
}

/* ============ 答题 ============ */
/* 题目改短后卡片会明显变矮，靠垂直居中撑住整屏，避免上重下空 */
#quiz{
  min-height:calc(100vh - 74px);
  min-height:calc(100dvh - 74px);
  display:flex; flex-direction:column; justify-content:center;
}
#quiz .q-top{
  display:flex; align-items:center; justify-content:space-between;
  font-size:12.5px; color:var(--muted); letter-spacing:.6px;
}
#count{font-variant-numeric:tabular-nums; font-weight:600; color:#B07344}
.track{height:5px; border-radius:99px; background:rgba(196,150,110,.20); margin:10px 0 22px; overflow:hidden}
.track i{display:block; height:100%; width:0; border-radius:99px;
  background:linear-gradient(90deg,#E2A268,var(--accent)); transition:width .32s ease}
#eyebrow{font-size:22px; font-weight:900; letter-spacing:-.3px; color:#A9581F; margin:0 0 10px}
#prompt{margin:0 0 24px; font-size:19px; line-height:1.72; color:var(--ink); font-weight:600}
#answers{display:flex; flex-direction:column; gap:12px}
.answer{
  display:block; width:100%; text-align:left; cursor:pointer;
  font-family:inherit; font-size:16px; line-height:1.72; color:var(--ink);
  padding:17px 18px; border-radius:var(--radius-sm);
  background:var(--card-2);
  border:1.5px solid var(--line);
  box-shadow:var(--shadow-sm);
  transition:border-color .15s ease, background .15s ease, transform .15s ease;
}
.answer:active{border-color:var(--accent); background:#FFF2E2; transform:scale(.994)}
.answer b{color:#B07344; font-weight:800; margin-right:2px}

.linkbtn{
  margin-top:18px; display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--line-2); background:rgba(255,252,247,.8);
  color:var(--ink-2); font-family:inherit; font-size:13.5px;
  padding:9px 16px; border-radius:999px; cursor:pointer;
}
.linkbtn:disabled{opacity:.38}

/* ============ 照片卡 ============ */
.photo{
  position:relative; overflow:hidden;
  aspect-ratio:720/790;
  border-radius:24px;
  background:#EFE7DB;
  border:1px solid rgba(190,132,78,.18);
  box-shadow:0 18px 34px -22px rgba(120,72,30,.55), inset 0 0 0 1px rgba(255,255,255,.5);
}
.photo img{
  width:100%; height:100%; display:block;
  object-fit:cover; object-position:50% 0%;
  filter:saturate(1.06) sepia(.14) brightness(1.015) contrast(1.02);
}
.photo .tag{
  position:absolute; left:14px; bottom:14px;
  display:inline-flex; align-items:center; gap:7px;
  padding:7px 13px; border-radius:999px;
  background:rgba(255,251,243,.90);
  border:1px solid rgba(190,132,78,.30);
  box-shadow:0 6px 14px -8px rgba(120,72,30,.6);
  backdrop-filter:blur(4px);
  font-size:13px; font-weight:800; letter-spacing:1.2px; color:#A9581F;
}
.photo .tag small{font-size:11px; font-weight:600; letter-spacing:0; color:var(--muted)}

/* 照片铺满卡片顶部，正文压在半透明奶油面上：
   图片的灰底不再有一圈硬边界，左右上三条边与卡片重合，下边被奶油面盖住 */
.sheet{
  position:relative; margin-top:-46px;
  padding:8px 22px 24px;
  border-radius:24px 24px 0 0;
  background:linear-gradient(180deg,
    rgba(255,252,247,.72) 0,
    rgba(255,252,247,.96) 70px,
    #FFFCF7 118px);
  -webkit-backdrop-filter:blur(12px) saturate(1.15);
  backdrop-filter:blur(12px) saturate(1.15);
  box-shadow:0 -16px 30px -22px rgba(120,72,30,.55);
}
.sheet > :first-child{margin-top:12px}

#result .card{padding:0; overflow:hidden}
#result .card > .photo{margin:0; border:0; border-radius:0; box-shadow:none}
#result .card > .photo .tag{left:16px; bottom:72px}

/* ============ 结果 ============ */
.done{
  margin:0 0 14px; text-align:center;
  font-size:13px; letter-spacing:3px; color:#B07344; font-weight:700;
}
.name{
  margin:18px 0 6px; text-align:center;
  font-size:29px; font-weight:900; letter-spacing:-.4px; color:#8E4520;
}
.quote{
  margin:0 auto 16px; max-width:420px; text-align:center;
  font-size:15px; line-height:1.8; color:var(--ink-2);
}
.traits{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:22px}
.traits span{
  font-size:12.5px; padding:6px 13px; border-radius:999px;
  background:var(--accent-soft); border:1px solid rgba(200,118,58,.20);
  color:#A9581F; font-weight:600;
}

.share{
  border-top:1px dashed var(--line-2);
  margin:0 0 18px; padding-top:18px;
}
.share-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
.share-row b{font-size:13.5px; color:var(--ink-2); font-weight:700; letter-spacing:.4px}
.mini{
  border:1px solid var(--line-2); background:rgba(255,255,255,.72);
  color:var(--ink-2); font-family:inherit; font-size:12.5px;
  padding:6px 13px; border-radius:999px; cursor:pointer; white-space:nowrap;
}
.mini:active{background:#FFF2E2}
.share-text{
  margin:0; padding:13px 15px;
  font-size:14px; line-height:1.75; color:var(--ink-2);
  background:var(--card-2); border:1px solid var(--line); border-radius:14px;
  word-break:break-word;
}

.btn-second{
  display:flex; align-items:center; justify-content:center; width:100%;
  margin-top:10px; padding:14px 18px;
  font-family:inherit; font-size:14px; font-weight:600;
  color:#A9581F; background:rgba(255,255,255,.66);
  border:1.5px solid rgba(200,118,58,.32); border-radius:999px;
  cursor:pointer; text-decoration:none;
}
.btn-second:active{background:#FFF2E2}

.fine{
  margin:14px 0 0; font-size:12px; line-height:1.8; color:var(--muted); text-align:center;
}
.again-row{display:flex; justify-content:center; margin-top:22px}
.again-row .linkbtn{margin-top:0}

/* ============ 报告 ============ */
#report .card{background:none; border:0; box-shadow:none; padding:0}
.rep-head{text-align:center; margin-bottom:18px}
.rep-head .name{margin-top:16px}

/* 报告页同款：照片从顶部铺满，正文压在奶油面上 */
#report .rep-head{
  border-radius:24px; overflow:hidden;
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
}
#report .rep-head > .photo{margin:0; border:0; border-radius:0; box-shadow:none}
#report .rep-head > .photo .tag{left:16px; bottom:72px}
#report .rep-head > .sheet{padding-bottom:20px}
.sec{
  background:var(--card); border:1px solid var(--line);
  border-radius:20px; box-shadow:var(--shadow-sm);
  padding:19px 20px; margin-bottom:13px;
}
.sec h3{
  margin:0 0 9px; display:flex; align-items:center; gap:8px;
  font-size:15.5px; font-weight:800; color:#8E4520; letter-spacing:.2px;
}
.sec h3::before{content:""; width:4px; height:15px; border-radius:2px;
  background:linear-gradient(180deg,#E2A268,var(--accent));}
.sec p{margin:0; font-size:14.5px; line-height:1.85; color:var(--ink-2)}

/* ============ toast ============ */
#toast{
  position:fixed; left:50%; bottom:34px; transform:translate(-50%,14px);
  padding:11px 20px; border-radius:999px;
  background:rgba(67,48,31,.94); color:#FFF7EC;
  font-size:13.5px; opacity:0; pointer-events:none;
  transition:opacity .22s ease, transform .22s ease;
  z-index:99; max-width:80vw; text-align:center;
}
#toast.show{opacity:1; transform:translate(-50%,0)}

.hidden{display:none !important}

@media (max-width:400px){
  .hero-h1{font-size:31px}
  .name{font-size:25px}
  .wrap{padding-left:16px; padding-right:16px}
}
</style>
</head>
<body>
<div class="bg"><div class="bg-blob"></div></div>

<main class="wrap">

  <!-- ================= 封面 ================= -->
  <section id="intro">
    <div class="brand">
      <b>DataClawHub</b><span class="bar"></span><i>央国企物流 AI 社区</i>
    </div>

    <h1 class="hero-h1">你是哪种<em>AI 程序</em>员？</h1>
    <p class="hero-sub">四道题，看看你跟 AI 一起干活时是哪一路。</p>

    <div class="strip">
      <img src="./assets/dtro.jpg" alt="">
      <img src="./assets/dtph.jpg" alt="">
      <img src="./assets/ntph.jpg" alt="">
      <img src="./assets/nbph.jpg" alt="">
    </div>
    <p class="strip-cap">16 种协作人格，你是哪一种？</p>

    <button class="btn" id="start" type="button" style="margin-top:26px">开始测试 · 约 1 分钟</button>
    <p class="btn-note">不收集个人信息。结果只在你的手机上生成。</p>
  </section>

  <!-- ================= 答题 ================= -->
  <section id="quiz" class="hidden">
    <div class="card">
      <div class="q-top"><span id="count">01 / 04</span><span>选择更接近你的那一个</span></div>
      <div class="track"><i id="fill"></i></div>
      <p id="eyebrow">第 01 题</p>
      <p id="prompt"></p>
      <div id="answers"></div>
      <button class="linkbtn" id="previous" type="button">← 返回上一题</button>
    </div>
  </section>

  <!-- ================= 结果 ================= -->
  <section id="result" class="hidden">
    <p class="done">测 试 完 成</p>
    <div class="card">
      <div class="photo">
        <img id="photo" src="" alt="">
        <div class="tag"><span id="code">----</span><small>AI 协作人格</small></div>
      </div>

      <div class="sheet">
        <h2 class="name" id="title"></h2>
        <p class="quote" id="quote"></p>
        <div class="traits" id="traits"></div>

        <div class="share">
          <div class="share-row">
            <b>分享文案</b>
            <span>
              <button class="mini" id="copy" type="button">复制文案</button>
              <button class="mini" id="shuffle" type="button">换个说法</button>
            </span>
          </div>
          <p class="share-text" id="sharePreview"></p>
        </div>

        <a class="btn" id="cta" href="#" target="_blank" rel="noopener">注册并解锁完整画像报告</a>
        <button class="btn-second" id="viewReport" type="button">已经注册过了？直接查看完整报告</button>

        <p class="fine">
          测试结果由 4 道题的作答方式推导，仅供自我参照。<br>
          完整报告需在 DataClawHub 注册后查看。
        </p>
      </div>
    </div>

    <div class="again-row"><button class="linkbtn" id="again" type="button">再测一次</button></div>
  </section>

  <!-- ================= 完整报告 ================= -->
  <section id="report" class="hidden">
    <div class="card">
      <div class="rep-head">
        <div class="photo">
          <img id="rPhoto" src="" alt="">
          <div class="tag"><span id="rCode">----</span><small>AI 协作人格</small></div>
        </div>
        <div class="sheet">
          <h2 class="name" id="rName"></h2>
          <p class="quote" id="rQuote"></p>
          <div class="traits" id="rTraits"></div>
        </div>
      </div>

      <div class="sec">
        <h3>你的工作方式</h3>
        <p id="rHow"></p>
      </div>
      <div class="sec">
        <h3>你的盲点</h3>
        <p id="rBlind"></p>
      </div>
      <div class="sec">
        <h3>接下来</h3>
        <p id="rNext"></p>
      </div>

      <a class="btn" id="rCta" href="#" target="_blank" rel="noopener" style="margin-top:18px">去 DataClawHub 看看 →</a>
      <button class="btn-second" id="rBack" type="button">返回结果页</button>
      <button class="btn-second" id="rRetake" type="button">重新测试</button>
    </div>
  </section>

</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  /* ---------- 配置 ---------- */
  var INVITE_CODE = 'BSHHCZ';
  var REGISTER_URL = 'https://dataclawhub.com/login?mode=register&ref=' + INVITE_CODE;
  var STORE_KEY = 'nw_progress_v1';
  var TYPE_KEY  = 'nw_type_v1';

  /* ---------- 题库：4 题，每维 1 题，各标注所属极 ---------- */
  var QUESTIONS = [
    { q:'AI 很肯定地说：这家店超好吃。',
      a:[ {t:'先翻评分和差评', p:'D'},
          {t:'去了再说，尝了才知道', p:'N'} ] },
    { q:'要写一段自我介绍，憋了半小时。',
      a:[ {t:'让 AI 先写，我再改', p:'T'},
          {t:'自己写完，让 AI 挑错', p:'B'} ] },
    { q:'周末了，不知道去哪。',
      a:[ {t:'去朋友推荐过的', p:'R'},
          {t:'自己挑一个没听说过的', p:'P'} ] },
    { q:'四个人，明天要交，现在还没开始。',
      a:[ {t:'先分工，写清谁做什么', p:'O'},
          {t:'直接帮团队啃最难的那块', p:'H'} ] }
  ];

  /* ---------- 16 型数据 ---------- */
  var TYPES = {
    DTRO:{name:'链式·调度师', quote:'你不造轮子，你让轮子们一起跑起来。',
      traits:['数据驱动','善用现成','复用优先','擅长编排'],
      how:'你动手前习惯先看数据——分布在哪里、异常在哪里，规则要有据可依。遇到新需求，你的第一反应是去社区里找现成的开放工具或服务，先接上跑通，而不是立刻自己写。你真正的长处在后半程：把几个各有所长的工具和智能体编排成一条顺畅的流水线，让它们各管一段、彼此衔接。你不追求每个环节都由自己实现，你在意的是整条链路能不能稳定跑完。',
      blind:'复用让你跑得比谁都快，但也让你更容易停在"能用就好"——少数需要深挖的场景里，你会比自研派更早撞上工具的天花板。对底层实现的理解常常停在够用层面，遇到工具不支持的边角需求时容易束手。',
      next:'挑一个已经跑通的社区成果，试着把它接到你自己的流程里，当第一环。'},
    DTRH:{name:'链式·改造师', quote:'先接上，再把它改到好用。',
      traits:['数据驱动','善用现成','复用优先','专注攻坚'],
      how:'你动手前先看数据，规则要有据可依。你习惯站在别人的成果上起步——找现成的开放工具或社区已有方案先接上，而不是从零去造。但你不会止步于"能用"：当现成方案在某个环节卡住，你会钻进去把它改到真正贴合业务。你的价值往往体现在那些"别人做了一半、差最后一公里"的项目上——你既懂怎么复用，也肯深挖那一公里。',
      blind:'你擅长把别人的东西改好，但长期做改造容易让你的技术判断被原方案的假设框住。很少有机会从零设计一套架构，独立开新局的经验相对薄弱。',
      next:'找一个「能跑但不够稳」的社区项目，从它最卡的那一环开始改。'},
    DTPO:{name:'链式·架构师', quote:'先想清楚骨架，再决定每块用什么。',

  /* ---------- 分享文案模板（3 个，轮换） ---------- */
  var TEMPLATES = [
    function(t, code){ return '4 道题测出我是「' + t.name + '」' + code + '。' + t.quote + '你是什么型？'; },
    function(t){ return '测了下 AI 程序员画像，我是「' + t.name + '」。想知道你是哪种？1 分钟，点开就知道。'; },
    function(t){ return t.quote + '\n我是「' + t.name + '」，你是哪个？'; }
  ];
  var tplIndex = 0;

  /* ---------- 元素 ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var elIntro = $('intro'), elQuiz = $('quiz'), elResult = $('result'), elReport = $('report');

  /* ---------- 链接 ---------- */
  function reportUrlFor(code){
    return location.origin + location.pathname + '?type=' + code;
  }
  function registerUrlFor(code){
    return REGISTER_URL + '&type=' + code + '&redirect=' + encodeURIComponent(reportUrlFor(code));
  }

  /* ---------- 状态 ---------- */
  var step = 0;
  var picks = [];
  var tally = {D:0,N:0,T:0,B:0,R:0,P:0,O:0,H:0};
  var currentType = null;

  /* ---------- 计分 ----------
     4 个维度，各 1 题；同一维度的两极互斥，选中哪极就是哪极。
     所以阈值是 >= 1，不是 >= 2（>= 2 是每维 3 题多数决时的写法）。
     若照抄 >= 2，每题最多只记 1，四个维度全部落到默认极 → 永远输出 NBPH。 */
  function computeCode(){
    return (tally.D >= 1 ? 'D' : 'N')
         + (tally.T >= 1 ? 'T' : 'B')
         + (tally.R >= 1 ? 'R' : 'P')
         + (tally.O >= 1 ? 'O' : 'H');
  }

  /* ---------- 渲染题目 ---------- */
  function render(){
    var item = QUESTIONS[step];
    $('count').textContent = pad(step + 1) + ' / ' + pad(QUESTIONS.length);
    $('fill').style.width = ((step) / QUESTIONS.length * 100) + '%';
    $('eyebrow').textContent = '第 ' + pad(step + 1) + ' 题';
    $('prompt').textContent = item.q;

    var list = $('answers');
    list.innerHTML = '';
    item.a.forEach(function(opt, idx){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'answer';
      var strong = document.createElement('b');
      strong.textContent = String.fromCharCode(65 + idx) + '.';
      b.appendChild(strong);
      b.appendChild(document.createTextNode(' ' + opt.t));
      b.addEventListener('click', function(){ answer(idx); });
      list.appendChild(b);
    });

    $('previous').disabled = (step === 0);
    save();
  }

  function pad(n){ return (n < 10 ? '0' : '') + n; }

  /* ---------- 作答 / 回退 ---------- */
  function answer(idx){
    var pole = QUESTIONS[step].a[idx].p;
    // 重答同一题时先撤掉上一次的记录，避免累加
    var prevIdx = picks[step];
    if (typeof prevIdx === 'number') tally[QUESTIONS[step].a[prevIdx].p]--;
    tally[pole]++;
    picks[step] = idx;
    step++;
    if (step < QUESTIONS.length) { render(); window.scrollTo({top:0}); }
    else { showResult(); }
  }

  function previous(){
    if (step === 0) return;
    step--;
    var idx = picks[step];
    if (typeof idx === 'number') { tally[QUESTIONS[step].a[idx].p]--; picks[step] = undefined; }
    render();
    window.scrollTo({top:0});
  }

  /* ---------- 结果 ---------- */
  function renderResult(code){
    var t = TYPES[code];
    if (!t) return false;
    currentType = t;

    elIntro.classList.add('hidden');
    elQuiz.classList.add('hidden');
    elReport.classList.add('hidden');
    elResult.classList.remove('hidden');

    $('code').textContent = code;
    $('title').textContent = t.name;
    $('quote').textContent = t.quote;
    $('photo').src = './assets/' + code.toLowerCase() + '.jpg';
    $('photo').alt = t.name + ' 的形象';

    var box = $('traits');
    box.innerHTML = '';
    (t.traits || []).forEach(function(label){
      var s = document.createElement('span');
      s.textContent = label;
      box.appendChild(s);
    });

    $('cta').href = registerUrlFor(code);

    tplIndex = 0;
    renderShare();
    return true;
  }

  function showResult(){
    var code = computeCode();
    if (!renderResult(code)) return;
    rememberType(code);
    clearSave();
    window.scrollTo({top:0});
  }

  /* ---------- 完整画像报告 ---------- */
  function showReport(code){
    var t = TYPES[code];
    if (!t) return false;
    currentType = t;

    elIntro.classList.add('hidden');
    elQuiz.classList.add('hidden');
    elResult.classList.add('hidden');
    elReport.classList.remove('hidden');

    $('rCode').textContent = code;
    $('rName').textContent = t.name;
    $('rQuote').textContent = t.quote;
    $('rPhoto').src = './assets/' + code.toLowerCase() + '.jpg';
    $('rPhoto').alt = t.name + ' 的形象';

    var box = $('rTraits');
    box.innerHTML = '';
    (t.traits || []).forEach(function(label){
      var s = document.createElement('span');
      s.textContent = label;
      box.appendChild(s);
    });

    $('rHow').textContent = t.how || '';
    $('rBlind').textContent = t.blind || '';
    $('rNext').textContent = t.next || '';
    $('rCta').href = registerUrlFor(code);

    window.scrollTo({top:0});
    return true;
  }

  function renderShare(){
    $('sharePreview').textContent = TEMPLATES[tplIndex](currentType, $('code').textContent);
  }

  /* ---------- 复制 ---------- */
  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function(){ return legacyCopy(text); });
    }
    return legacyCopy(text);
  }
  function legacyCopy(text){
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly','');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok ? Promise.resolve() : Promise.reject();
    } catch (e) { return Promise.reject(e); }
  }

  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function(){ t.classList.remove('show'); }, 2000);
  }

  /* ---------- 记住类型 ---------- */
  function rememberType(code){
    if (!TYPES[code]) return;
    try { localStorage.setItem(TYPE_KEY, JSON.stringify({ code: code, at: Date.now() })); } catch(e){}
  }
  function recallType(){
    try {
      var raw = localStorage.getItem(TYPE_KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (d && typeof d.code === 'string' && TYPES[d.code]) return d.code;
    } catch(e){}
    return null;
  }
  function hasProgress(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      return !!(d && typeof d.step === 'number' && d.step > 0);
    } catch(e){ return false; }
  }

  /* ---------- 本地进度 ---------- */
  function save(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify({step:step, picks:picks})); } catch(e){}
  }
  function load(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || !Array.isArray(d.picks)) return false;
      var n = Math.min(d.step || 0, QUESTIONS.length - 1);
      if (n <= 0) return false;
      step = n;
      picks = d.picks.slice(0, n);
      tally = {D:0,N:0,T:0,B:0,R:0,P:0,O:0,H:0};
      for (var i = 0; i < n; i++) {
        var idx = picks[i];
        if (typeof idx === 'number') tally[QUESTIONS[i].a[idx].p]++;
      }
      return true;
    } catch(e){ return false; }
  }
  function clearSave(){
    try { localStorage.removeItem(STORE_KEY); } catch(e){}
  }

  /* ---------- 事件 ---------- */
  $('start').addEventListener('click', function(){
    elIntro.classList.add('hidden');
    elQuiz.classList.remove('hidden');
    if (!load()) { step = 0; picks = []; tally = {D:0,N:0,T:0,B:0,R:0,P:0,O:0,H:0}; }
    render();
    window.scrollTo({top:0});
  });

  $('previous').addEventListener('click', previous);

  $('copy').addEventListener('click', function(){
    copyText($('sharePreview').textContent)
      .then(function(){ toast('已复制，去发朋友圈吧'); })
      .catch(function(){ toast('复制失败，请长按上方文案手动复制'); });
  });

  $('shuffle').addEventListener('click', function(){
    tplIndex = (tplIndex + 1) % TEMPLATES.length;
    renderShare();
    toast('换了一种说法');
  });

  $('again').addEventListener('click', function(){
    step = 0; picks = [];
    tally = {D:0,N:0,T:0,B:0,R:0,P:0,O:0,H:0};
    currentType = null;
    clearSave();
    elResult.classList.add('hidden');
    elIntro.classList.remove('hidden');
    window.scrollTo({top:0, behavior:'smooth'});
  });

  $('viewReport').addEventListener('click', function(){
    if (!showReport(computeCode())) toast('暂时无法生成报告，请重新测试');
  });

  $('rBack').addEventListener('click', function(){
    var code = $('rCode').textContent;
    if (TYPES[code] && renderResult(code)) return;
    elReport.classList.add('hidden');
    elIntro.classList.remove('hidden');
    window.scrollTo({top:0, behavior:'smooth'});
  });

  $('rRetake').addEventListener('click', function(){
    step = 0; picks = [];
    tally = {D:0,N:0,T:0,B:0,R:0,P:0,O:0,H:0};
    currentType = null;
    clearSave();
    elReport.classList.add('hidden');
    elResult.classList.add('hidden');
    elQuiz.classList.add('hidden');
    elIntro.classList.remove('hidden');
    window.scrollTo({top:0, behavior:'smooth'});
  });

  /* ---------- 入口路由：?type= > 本机记忆 > 封面 ---------- */
  (function route(){
    var code = null;
    try {
      var m = location.search.match(/[?&]type=([A-Za-z]{4})(?:&|$)/);
      if (m) code = m[1].toUpperCase();
    } catch(e){}

    if (code && TYPES[code]) { showReport(code); return; }
    if (hasProgress()) return;
    var remembered = recallType();
    if (remembered) { showReport(remembered); return; }
  })();

})();
</script>
</body>
</html>
